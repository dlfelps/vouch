name: tests

# The suite on both platforms vouch is used on, at the bounds of `requires-python` and at
# 3.12, the first Python with sys.monitoring (function-level code tracking, SPEC §8.2).
# Windows is in the matrix because four of the defects found in use were Windows-only, and
# 3.10 because a 3.12-only f-string made the lint a SyntaxError there in 0.1 to 0.4.
# Tests that need pdflatex, latexmk or uv skip themselves where those are absent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hatch-vcs takes the version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
