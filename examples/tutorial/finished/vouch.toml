# vouch.toml -- see SPEC.md section 3.3. Every setting has a default.

[[paper]]
main = "paper/main.tex"

# Project-wide defaults for metric keys, matched by glob. {0}, {1}, {-1} are key
# segments, so evaluate.knn.n_train_640.acc gets "test accuracy of knn (n_train_640)".
[metrics]
"*.acc"       = { fmt = ".1pct", better = "higher", desc = "test accuracy of {1} ({2}), mean and std over seeds" }
"*.train_acc" = { fmt = ".1pct", better = "higher", desc = "training accuracy of {1} ({2}), mean and std over seeds" }

# [format]
# rounding = "half_up"         # or "half_even"
# default_float = ".3g"
# siunitx = false
# named = { pct1 = ".1pct" }

# [freshness]
# granularity = "function"     # or "module"
